name: capture-yggdrasil-known-5

on:
  push:
    paths:
      - '.github/workflows/capture-yggdrasil-known-5.yml'
  workflow_dispatch:

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: multifly-2-multimax
            gameid: "10894"
            url: https://yggdrasilgaming.com/games/multifly-2-multimax#tryit
          - slug: timber-trail-treasures
            gameid: "10911"
            url: https://yggdrasilgaming.com/games/timber-trail-treasures#tryit
          - slug: giga-zombies-gigablox
            gameid: "10909"
            url: https://yggdrasilgaming.com/games/giga-zombies-gigablox#tryit
          - slug: turbo-gold-deluxe-gigablox
            gameid: "10981"
            url: https://yggdrasilgaming.com/games/turbo-gold-deluxe-gigablox#tryit
          - slug: red-dragon-sails
            gameid: "10764"
            url: https://yggdrasilgaming.com/games/red-dragon-sails#tryit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture buy candidates
        env:
          TARGET_URL: ${{ matrix.url }}
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
        run: |
          cat > /tmp/cap.py <<'PY'
          import asyncio, json, os, re, time
          from pathlib import Path
          from urllib.parse import parse_qs
          from playwright.async_api import async_playwright

          O=Path("out"); O.mkdir(exist_ok=True)
          ev=[]

          def form(body):
              if not body: return {}
              try:
                  q=parse_qs(body,keep_blank_values=True)
                  return {k:(v[0] if len(v)==1 else v) for k,v in q.items()}
              except: return {"_raw":body}

          async def body(resp):
              try:
                  t=await resp.text()
              except Exception as e:
                  return {"error":str(e)}
              if "json" in (resp.headers.get("content-type") or "").lower():
                  try:return json.loads(t)
                  except: pass
              return t[:100000]

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  c=await b.new_context(viewport={"width":1440,"height":1000})
                  pg=await c.new_page()

                  async def req(r):
                      if "demo.yggdrasilgaming.com/game.web/service" in r.url:
                          ev.append({"kind":"request","method":r.method,"url":r.url,"post":r.post_data,"form":form(r.post_data),"ts":time.time()})
                  async def resp(r):
                      if "demo.yggdrasilgaming.com/game.web/service" in r.url:
                          ev.append({"kind":"response","method":r.request.method,"url":r.url,"status":r.status,"body":await body(r),"ts":time.time()})
                  pg.on("request",req); pg.on("response",resp)

                  await pg.goto(os.environ["TARGET_URL"],wait_until="domcontentloaded",timeout=90000)
                  await pg.wait_for_timeout(1500)
                  for t in ["ACCEPT COOKIES","YES, I AM OVER 18"]:
                      try:
                          q=pg.get_by_text(t,exact=False)
                          if await q.count(): await q.first.click(timeout=2500)
                      except: pass
                  try:
                      q=pg.get_by_text("PLAY",exact=True)
                      if await q.count(): await q.first.click(timeout=3500)
                  except: pass
                  await pg.wait_for_timeout(16000)

                  gf=next(f for f in pg.frames if f"/{os.environ['GAMEID']}/" in f.url)
                  box=await gf.locator("body").bounding_box()
                  w=box["width"]; h=box["height"]

                  # get through splash + close likely info overlays
                  for _ in range(8):
                      for rx,ry in [(0.5,.86),(0.5,.76),(0.5,.9)]:
                          try: await gf.locator("body").click(position={"x":w*rx,"y":h*ry},force=True)
                          except: pass
                          await pg.wait_for_timeout(350)
                      await pg.wait_for_timeout(900)

                  await pg.wait_for_timeout(2500)
                  await gf.locator("body").screenshot(path=str(O/"game.png"))

                  # search for controls by grid and record any new fn=play
                  hits=[]
                  pts=[]
                  for ry in [.55,.62,.69,.76,.83,.90]:
                      for rx in [.05,.10,.16,.22,.30,.38,.46,.54,.62,.70,.78,.84,.90,.95]:
                          pts.append((rx,ry))

                  for rx,ry in pts:
                      before=len(ev)
                      try: await gf.locator("body").click(position={"x":w*rx,"y":h*ry},force=True)
                      except: continue
                      await pg.wait_for_timeout(500)
                      d=ev[before:]
                      plays=[x for x in d if "fn=play" in x.get("url","")]
                      if plays:
                          hits.append({"rx":rx,"ry":ry,"events":plays})
                          break

                  # if a likely BUY menu was opened but not confirmed, probe central modal grid
                  if not hits:
                      for rx,ry in [(.55,.35),(.60,.35),(.65,.35),(.55,.50),(.60,.50),(.65,.50),(.5,.65),(.6,.65)]:
                          before=len(ev)
                          try: await gf.locator("body").click(position={"x":w*rx,"y":h*ry},force=True)
                          except: continue
                          await pg.wait_for_timeout(700)
                          plays=[x for x in ev[before:] if "fn=play" in x.get("url","")]
                          if plays:
                              hits.append({"rx":rx,"ry":ry,"events":plays})
                              break

                  await gf.locator("body").screenshot(path=str(O/"final.png"))
                  out={"slug":os.environ["SLUG"],"gameid":os.environ["GAMEID"],"body_box":box,"hits":hits,"service":ev}
                  (O/"capture.json").write_text(json.dumps(out,indent=2),encoding="utf-8")
                  print(json.dumps({"slug":out["slug"],"gameid":out["gameid"],"hits":hits},indent=2))
                  await b.close()

          asyncio.run(main())
          PY
          python /tmp/cap.py
      - uses: actions/upload-artifact@v4
        with:
          name: known-${{ matrix.slug }}
          path: out
