name: finish-timber-and-turbo

on:
  push:
    paths: ['.github/workflows/finish-timber-and-turbo.yml']
  workflow_dispatch:

jobs:
  timber:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: timber-16-20fs, y: 447}
          - {variant: timber-20fs, y: 638}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture scrolled Timber buy
        env:
          VARIANT: ${{ matrix.variant }}
          Y: ${{ matrix.y }}
        run: |
          cat >/tmp/x.py <<'PY'
          import asyncio,json,os,time
          from pathlib import Path
          from urllib.parse import parse_qs
          from playwright.async_api import async_playwright
          O=Path("out");O.mkdir(exist_ok=True);gid="10911"
          u=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          def form(s):
            if not s:return {}
            d=parse_qs(s,keep_blank_values=True);return {k:(v[0] if len(v)==1 else v) for k,v in d.items()}
          async def rb(r):
            try:t=await r.text()
            except Exception as e:return {"_error":str(e)}
            try:return json.loads(t)
            except:return t[:250000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1296,"height":729});pg=await c.new_page()
              def rq(r):
                if "game.web/service" in r.url:ev.append({"kind":"request","method":r.method,"url":r.url,"post_data":r.post_data,"form":form(r.post_data),"ts":time.time()})
              async def rs(r):
                if "game.web/service" in r.url:ev.append({"kind":"response","method":r.request.method,"url":r.url,"status":r.status,"body":await rb(r),"ts":time.time()})
              pg.on("request",rq);pg.on("response",rs)
              await pg.goto(u,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(16000)
              body=pg.locator("body");box=await body.bounding_box()
              for _ in range(4):
                for rx,ry in [(0.5,0.85),(0.5,0.9),(0.5,0.78),(0.5,0.85)]:
                  try:await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                  except:pass
                  await pg.wait_for_timeout(300)
                await pg.wait_for_timeout(650)
              await pg.wait_for_timeout(2200)
              await body.click(position={"x":1220,"y":540},force=True);await pg.wait_for_timeout(800)
              await pg.mouse.move(800,580);await pg.mouse.wheel(0,500);await pg.wait_for_timeout(800)
              start=len(ev)
              await body.click(position={"x":775,"y":float(os.environ["Y"])},force=True);await pg.wait_for_timeout(700)
              await body.click(position={"x":770,"y":448},force=True);await pg.wait_for_timeout(4500)
              req=[x for x in ev[start:] if x["kind"]=="request" and "fn=play" in x["url"]];res=[x for x in ev[start:] if x["kind"]=="response" and "fn=play" in x["url"]]
              pairs=[{"request":r,"response":res[i] if i<len(res) else None} for i,r in enumerate(req)]
              result={"provider":"yggdrasil","slug":"timber-trail-treasures","game_id":gid,"variant":os.environ["VARIANT"],"pairs":pairs}
              (O/"capture.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"variant":os.environ["VARIANT"],"forms":[p["request"]["form"] for p in pairs],"statuses":[(p.get("response") or {}).get("status") for p in pairs]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/x.py
      - uses: actions/upload-artifact@v4
        with:
          name: timber-extra-${{ matrix.variant }}
          path: out

  turbo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {branch: enter, x: 520, y: 500}
          - {branch: gamble, x: 780, y: 500}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture delayed Turbo decision
        env:
          BRANCH: ${{ matrix.branch }}
          X: ${{ matrix.x }}
          Y: ${{ matrix.y }}
        run: |
          cat >/tmp/t.py <<'PY'
          import asyncio,json,os,time
          from pathlib import Path
          from urllib.parse import parse_qs
          from playwright.async_api import async_playwright
          O=Path("out");O.mkdir(exist_ok=True);gid="10981"
          u=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          def form(s):
            if not s:return {}
            d=parse_qs(s,keep_blank_values=True);return {k:(v[0] if len(v)==1 else v) for k,v in d.items()}
          async def rb(r):
            try:t=await r.text()
            except Exception as e:return {"_error":str(e)}
            try:return json.loads(t)
            except:return t[:250000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1296,"height":729});pg=await c.new_page()
              def rq(r):
                if "game.web/service" in r.url:ev.append({"kind":"request","method":r.method,"url":r.url,"post_data":r.post_data,"form":form(r.post_data),"ts":time.time()})
              async def rs(r):
                if "game.web/service" in r.url:ev.append({"kind":"response","method":r.request.method,"url":r.url,"status":r.status,"body":await rb(r),"ts":time.time()})
              pg.on("request",rq);pg.on("response",rs)
              await pg.goto(u,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(16000)
              body=pg.locator("body");box=await body.bounding_box()
              for _ in range(4):
                for rx,ry in [(0.5,0.85),(0.5,0.9),(0.5,0.78),(0.5,0.85)]:
                  try:await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                  except:pass
                  await pg.wait_for_timeout(300)
                await pg.wait_for_timeout(650)
              await pg.wait_for_timeout(2200)
              await body.click(position={"x":145,"y":330},force=True);await pg.wait_for_timeout(800)
              start=len(ev);await body.click(position={"x":648,"y":460},force=True)
              await pg.wait_for_timeout(35000)
              await body.screenshot(path=str(O/"decision.png"))
              before=len(ev);await body.click(position={"x":float(os.environ["X"]),"y":float(os.environ["Y"])},force=True);await pg.wait_for_timeout(3500)
              await body.screenshot(path=str(O/"after.png"))
              result={"branch":os.environ["BRANCH"],"all_play":[x for x in ev[start:] if "fn=play" in x.get("url","")],"choice_delta":[x for x in ev[before:] if "fn=play" in x.get("url","")]}
              (O/"capture.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"branch":os.environ["BRANCH"],"forms":[x["form"] for x in result["choice_delta"] if x["kind"]=="request"],"statuses":[x["status"] for x in result["choice_delta"] if x["kind"]=="response"]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/t.py
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-final-${{ matrix.branch }}
          path: out
