name: open-buy-menus-piggies-red-bloody

on:
  push:
    paths:
      - '.github/workflows/open-buy-menus-piggies-red-bloody.yml'
  workflow_dispatch:

jobs:
  menu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: 3-piggies-of-bank, gameid: "10945", intro: normal, start_x: 725, start_y: 790, buy_x: 1370, buy_y: 800}
          - {slug: red-dragon-sails, gameid: "10764", intro: audio, start_x: 720, start_y: 840, buy_x: 1345, buy_y: 790}
          - {slug: bloody-pesos, gameid: "10809", intro: audio, start_x: 720, start_y: 870, buy_x: 1345, buy_y: 790}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Open menu
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
          INTRO: ${{ matrix.intro }}
          START_X: ${{ matrix.start_x }}
          START_Y: ${{ matrix.start_y }}
          BUY_X: ${{ matrix.buy_x }}
          BUY_Y: ${{ matrix.buy_y }}
        run: |
          cat > /tmp/menu.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          async def click(pg,x,y,n=1,p=700):
            for _ in range(n):
              await pg.mouse.click(x,y);await pg.wait_for_timeout(p)
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              sx=float(os.environ["START_X"]);sy=float(os.environ["START_Y"])
              if os.environ["INTRO"]=="audio":
                await click(pg,850,592,2,900)
              for dx,dy in [(0,0),(-20,0),(20,0),(0,-15),(0,15)]:
                await click(pg,sx+dx,sy+dy,1,600)
              await pg.wait_for_timeout(4000)
              await pg.screenshot(path=str(out/"main.png"))
              bx=float(os.environ["BUY_X"]);by=float(os.environ["BUY_Y"])
              await click(pg,bx,by,1,1600)
              await pg.screenshot(path=str(out/"buy-menu.png"))
              (out/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"game_id":gid},indent=2),encoding="utf-8")
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/menu.py
      - uses: actions/upload-artifact@v4
        with:
          name: menu-${{ matrix.slug }}
          path: out
