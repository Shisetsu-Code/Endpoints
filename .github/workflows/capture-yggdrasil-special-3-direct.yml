name: capture-yggdrasil-special-3-direct

on:
  push:
    paths:
      - '.github/workflows/capture-yggdrasil-special-3-direct.yml'
  workflow_dispatch:

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 3-piggies-of-bank
            gameid: "10945"
          - slug: gemstone-jam
            gameid: "10852"
          - slug: bloody-pesos
            gameid: "10809"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Direct runtime screenshots and service discovery
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
        run: |
          cat > /tmp/direct.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from urllib.parse import parse_qs
          from playwright.async_api import async_playwright

          O=Path("out");O.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          ev=[]
          runtime=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"

          def fbody(x):
              if not x:return {}
              q=parse_qs(x,keep_blank_values=True)
              return {k:(v[0] if len(v)==1 else v) for k,v in q.items()}

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1366,"height":768})
              pg=await c.new_page()
              pg.on("request",lambda r: ev.append({"method":r.method,"url":r.url,"post":r.post_data,"form":fbody(r.post_data)}) if "demo.yggdrasilgaming.com/game.web/service" in r.url else None)
              await pg.goto(runtime,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              box=await pg.locator("body").bounding_box()
              w,h=box["width"],box["height"]
              await pg.screenshot(path=str(O/"loaded.png"))

              for i in range(10):
                for rx,ry in [(.5,.85),(.5,.78),(.5,.9),(.5,.7)]:
                  try: await pg.locator("body").click(position={"x":w*rx,"y":h*ry},force=True)
                  except: pass
                  await pg.wait_for_timeout(350)
                await pg.wait_for_timeout(800)
              await pg.wait_for_timeout(2500)
              await pg.screenshot(path=str(O/"ready.png"))

              # click peripheral controls only, to open menus without intentionally spinning center controls
              probes=[]
              for rx,ry in [(.05,.55),(.05,.65),(.05,.75),(.05,.85),(.10,.85),(.90,.55),(.95,.55),(.90,.65),(.95,.65),(.90,.75),(.95,.75),(.90,.85),(.95,.85)]:
                before=len(ev)
                try: await pg.locator("body").click(position={"x":w*rx,"y":h*ry},force=True)
                except: continue
                await pg.wait_for_timeout(700)
                probes.append({"rx":rx,"ry":ry,"new":[e for e in ev[before:] if "fn=play" in e["url"]]})
                await pg.screenshot(path=str(O/f"probe-{int(rx*100)}-{int(ry*100)}.png"))

              data={"slug":os.environ["SLUG"],"gameid":gid,"runtime":runtime,"box":box,"probes":probes,"service":ev}
              (O/"capture.json").write_text(json.dumps(data,indent=2),encoding="utf-8")
              print(json.dumps({"slug":data["slug"],"gameid":gid,"plays":[e for e in ev if "fn=play" in e["url"]]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/direct.py
      - uses: actions/upload-artifact@v4
        with:
          name: special-${{ matrix.slug }}
          path: out
