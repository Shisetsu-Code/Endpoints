name: capture-3piggies-buys

on:
  push:
    paths: ['.github/workflows/capture-3piggies-buys.yml']
  workflow_dispatch:

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: double, x: 540, y: 272}
          - {variant: collect, x: 958, y: 272}
          - {variant: mystery, x: 540, y: 422}
          - {variant: random-bank, x: 958, y: 422}
          - {variant: all-banks, x: 540, y: 570}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture purchase
        env:
          VARIANT: ${{ matrix.variant }}
          X: ${{ matrix.x }}
          Y: ${{ matrix.y }}
        run: |
          cat >/tmp/p.py <<'PY'
          import asyncio,json,os,time
          from pathlib import Path
          from urllib.parse import parse_qs
          from playwright.async_api import async_playwright
          O=Path("out");O.mkdir(exist_ok=True);gid="10945"
          u=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          def form(s):
            if not s:return {}
            d=parse_qs(s,keep_blank_values=True);return {k:(v[0] if len(v)==1 else v) for k,v in d.items()}
          async def rb(r):
            try:t=await r.text()
            except Exception as e:return {"_error":str(e)}
            try:return json.loads(t)
            except:return t[:250000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1296,"height":729});pg=await c.new_page()
              def rq(r):
                if "game.web/service" in r.url:ev.append({"kind":"request","method":r.method,"url":r.url,"post_data":r.post_data,"form":form(r.post_data),"ts":time.time()})
              async def rs(r):
                if "game.web/service" in r.url:ev.append({"kind":"response","method":r.request.method,"url":r.url,"status":r.status,"body":await rb(r),"ts":time.time()})
              pg.on("request",rq);pg.on("response",rs)
              await pg.goto(u,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(16000)
              body=pg.locator("body");box=await body.bounding_box()
              for _ in range(4):
                for rx,ry in [(0.5,0.85),(0.5,0.9),(0.5,0.78),(0.5,0.85)]:
                  try:await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                  except:pass
                  await pg.wait_for_timeout(300)
                await pg.wait_for_timeout(650)
              await pg.wait_for_timeout(2300)
              await body.click(position={"x":1240,"y":585},force=True);await pg.wait_for_timeout(900)
              start=len(ev)
              await body.click(position={"x":float(os.environ["X"]),"y":float(os.environ["Y"])},force=True);await pg.wait_for_timeout(700)
              await body.screenshot(path=str(O/"confirm.png"))
              await body.click(position={"x":770,"y":448},force=True);await pg.wait_for_timeout(4500)
              req=[x for x in ev[start:] if x["kind"]=="request" and "fn=play" in x["url"]]
              res=[x for x in ev[start:] if x["kind"]=="response" and "fn=play" in x["url"]]
              pairs=[{"request":r,"response":res[i] if i<len(res) else None} for i,r in enumerate(req)]
              result={"provider":"yggdrasil","slug":"3-piggies-of-bank","game_id":gid,"variant":os.environ["VARIANT"],"endpoint":"https://demo.yggdrasilgaming.com/game.web/service?fn=play","pairs":pairs}
              (O/"capture.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"variant":os.environ["VARIANT"],"forms":[p["request"]["form"] for p in pairs],"statuses":[(p.get("response") or {}).get("status") for p in pairs]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/p.py
      - uses: actions/upload-artifact@v4
        with:
          name: piggies-${{ matrix.variant }}
          path: out
