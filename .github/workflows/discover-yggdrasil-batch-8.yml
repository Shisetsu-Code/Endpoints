name: discover-yggdrasil-batch-8

on:
  push:
    paths:
      - '.github/workflows/discover-yggdrasil-batch-8.yml'
  workflow_dispatch:

jobs:
  discover:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: multifly-2-multimax
            url: https://yggdrasilgaming.com/games/multifly-2-multimax#tryit
          - slug: 3-piggies-of-bank
            url: https://yggdrasilgaming.com/games/3-piggies-of-bank#tryit
          - slug: timber-trail-treasures
            url: https://yggdrasilgaming.com/games/timber-trail-treasures#tryit
          - slug: giga-zombies-gigablox
            url: https://yggdrasilgaming.com/games/giga-zombies-gigablox#tryit
          - slug: gemstone-jam
            url: https://yggdrasilgaming.com/games/gemstone-jam#tryit
          - slug: turbo-gold-deluxe-gigablox
            url: https://yggdrasilgaming.com/games/turbo-gold-deluxe-gigablox#tryit
          - slug: red-dragon-sails
            url: https://yggdrasilgaming.com/games/red-dragon-sails#tryit
          - slug: bloody-pesos
            url: https://yggdrasilgaming.com/games/bloody-pesos#tryit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Discover runtime
        env:
          TARGET_URL: ${{ matrix.url }}
          SLUG: ${{ matrix.slug }}
        run: |
          cat > /tmp/discover.py <<'PY'
          import asyncio, json, os, re
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs
          from playwright.async_api import async_playwright

          slug=os.environ["SLUG"]
          out=Path("out"); out.mkdir(exist_ok=True)
          events=[]

          async def main():
            async with async_playwright() as p:
                b=await p.chromium.launch(headless=True)
                c=await b.new_context(viewport={"width":1440,"height":1000})
                pg=await c.new_page()

                def on_req(r):
                    if r.resource_type in ("xhr","fetch","document"):
                        events.append({"method":r.method,"url":r.url,"type":r.resource_type,"post":r.post_data})
                pg.on("request", on_req)

                await pg.goto(os.environ["TARGET_URL"],wait_until="domcontentloaded",timeout=90000)
                await pg.wait_for_timeout(1800)

                for t in ["ACCEPT COOKIES","YES, I AM OVER 18"]:
                    try:
                        q=pg.get_by_text(t,exact=False)
                        if await q.count(): await q.first.click(timeout=2500)
                    except: pass

                try:
                    q=pg.get_by_text("PLAY", exact=True)
                    if await q.count(): await q.first.click(timeout=3500)
                except: pass

                await pg.wait_for_timeout(16000)
                frames=[f for f in pg.frames if "staticdemo.yggdrasilgaming.com/" in f.url]
                if not frames:
                    raise RuntimeError("game frame not found")
                gf=frames[0]
                m=re.search(r"staticdemo\.yggdrasilgaming\.com/(\d+)/",gf.url)
                gid=m.group(1) if m else "unknown"

                # Repeated proportional click around splash continue area.
                box=await gf.locator("body").bounding_box()
                if box:
                    for _ in range(7):
                        for rx,ry in [(0.50,0.85),(0.50,0.78),(0.50,0.90)]:
                            try:
                                await gf.locator("body").click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                            except: pass
                            await pg.wait_for_timeout(500)
                        await pg.wait_for_timeout(1100)

                await pg.wait_for_timeout(3500)
                await gf.locator("body").screenshot(path=str(out/"game.png"))

                service=[e for e in events if "demo.yggdrasilgaming.com/game.web/service" in e["url"]]
                meta={"slug":slug,"source_url":os.environ["TARGET_URL"],"game_id":gid,"runtime_url":gf.url,"body_box":box,"service":service}
                (out/"meta.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
                print(json.dumps(meta,indent=2))
                await b.close()

          asyncio.run(main())
          PY
          python /tmp/discover.py

      - uses: actions/upload-artifact@v4
        with:
          name: discover-${{ matrix.slug }}
          path: out
