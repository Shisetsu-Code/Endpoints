name: complete-red-dragon-features

on:
  push:
    paths: ['.github/workflows/complete-red-dragon-features.yml']
  workflow_dispatch:

jobs:
  complete:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: free-spins, option_y: 305}
          - {variant: money-dragon, option_y: 512}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Complete feature
        env:
          VARIANT: ${{ matrix.variant }}
          OPTION_Y: ${{ matrix.option_y }}
        run: |
          cat >/tmp/red.py <<'PY'
          import asyncio,json,os,time
          from pathlib import Path
          from urllib.parse import parse_qs
          from playwright.async_api import async_playwright
          O=Path("out");O.mkdir(exist_ok=True);gid="10764"
          u=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          def form(s):
            if not s:return {}
            d=parse_qs(s,keep_blank_values=True);return {k:(v[0] if len(v)==1 else v) for k,v in d.items()}
          async def rb(r):
            try:t=await r.text()
            except Exception as e:return {"_error":str(e)}
            try:return json.loads(t)
            except:return t[:250000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1296,"height":729});pg=await c.new_page()
              def rq(r):
                if "game.web/service" in r.url:ev.append({"kind":"request","method":r.method,"url":r.url,"post_data":r.post_data,"form":form(r.post_data),"ts":time.time()})
              async def rs(r):
                if "game.web/service" in r.url:ev.append({"kind":"response","method":r.request.method,"url":r.url,"status":r.status,"body":await rb(r),"ts":time.time()})
              pg.on("request",rq);pg.on("response",rs)
              await pg.goto(u,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(16000)
              body=pg.locator("body");box=await body.bounding_box()
              # audio + splash
              for _ in range(4):
                for rx,ry in [(0.59,0.62),(0.5,0.90),(0.5,0.85),(0.5,0.78)]:
                  try:await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                  except:pass
                  await pg.wait_for_timeout(300)
                await pg.wait_for_timeout(650)
              await pg.wait_for_timeout(2500)
              await body.click(position={"x":1220,"y":585},force=True);await pg.wait_for_timeout(800)
              start=len(ev)
              await body.click(position={"x":785,"y":float(os.environ["OPTION_Y"])},force=True);await pg.wait_for_timeout(700)
              await body.click(position={"x":770,"y":448},force=True);await pg.wait_for_timeout(3500)

              def play_count():
                return len([x for x in ev[start:] if x["kind"]=="request" and "fn=play" in x["url"]])

              # drive UI continuation; stop after several rounds with no new play
              idle=0; last=play_count()
              for step in range(60):
                for x,y in [(1190,365),(1210,365),(648,600),(648,500),(648,400)]:
                  before=play_count()
                  try:await body.click(position={"x":x,"y":y},force=True)
                  except:pass
                  await pg.wait_for_timeout(650)
                  if play_count()>before: break
                await pg.wait_for_timeout(1000)
                cur=play_count()
                if cur==last: idle+=1
                else: idle=0; last=cur
                if idle>=8: break
                if cur>=25: break
              await body.screenshot(path=str(O/"final.png"))
              req=[x for x in ev[start:] if x["kind"]=="request" and "fn=play" in x["url"]]
              res=[x for x in ev[start:] if x["kind"]=="response" and "fn=play" in x["url"]]
              pairs=[{"request":r,"response":res[i] if i<len(res) else None} for i,r in enumerate(req)]
              next_rounds=[]
              for p0 in pairs:
                rb0=(p0.get("response") or {}).get("body")
                try:
                  cd=rb0["data"]["wager"]["bets"][0]["eventdata"]["response"]["clientData"]
                  next_rounds.append(cd.get("NextRound"))
                except: next_rounds.append(None)
              result={"provider":"yggdrasil","slug":"red-dragon-sails","game_id":gid,"variant":os.environ["VARIANT"],"pairs":pairs,"next_rounds":next_rounds,"idle_at_end":idle}
              (O/"capture.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"variant":result["variant"],"play_count":len(pairs),"forms":[p["request"]["form"] for p in pairs],"next_round_present":[x is not None for x in next_rounds],"statuses":[(p.get("response") or {}).get("status") for p in pairs]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/red.py
      - uses: actions/upload-artifact@v4
        with:
          name: red-complete-${{ matrix.variant }}
          path: out
