name: yggdrasil-buy-menus-7

on:
  push:
    paths:
      - '.github/workflows/yggdrasil-buy-menus-7.yml'
  workflow_dispatch:

jobs:
  menu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: multifly-2-multimax, gameid: "10894"}
          - {slug: 3-piggies-of-bank, gameid: "10945"}
          - {slug: timber-trail-treasures, gameid: "10911"}
          - {slug: giga-zombies-gigablox, gameid: "10909"}
          - {slug: turbo-gold-deluxe-gigablox, gameid: "10981"}
          - {slug: red-dragon-sails, gameid: "10764"}
          - {slug: bloody-pesos, gameid: "10809"}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Open BUY menu
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
        run: |
          cat > /tmp/menu.py <<'PY'
          import asyncio,os,json
          from pathlib import Path
          from playwright.async_api import async_playwright

          O=Path("out");O.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          runtime=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              pg=await b.new_page(viewport={"width":1366,"height":768})
              await pg.goto(runtime,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              box=await pg.locator("body").bounding_box()
              w,h=box["width"],box["height"]

              for _ in range(8):
                for rx,ry in [(.5,.85),(.5,.78),(.5,.9),(.5,.7)]:
                  try: await pg.locator("body").click(position={"x":w*rx,"y":h*ry},force=True)
                  except: pass
                  await pg.wait_for_timeout(300)
                await pg.wait_for_timeout(800)

              await pg.wait_for_timeout(2000)
              await pg.screenshot(path=str(O/"ready.png"))

              # BUY is consistently on lower-right in Yggdrasil shell.
              for rx,ry in [(.96,.80),(.96,.84),(.94,.80),(.92,.80),(.97,.76)]:
                try:
                  await pg.locator("body").click(position={"x":w*rx,"y":h*ry},force=True)
                  await pg.wait_for_timeout(1200)
                except: pass

              await pg.screenshot(path=str(O/"buy-menu.png"))
              (O/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"gameid":gid,"box":box},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/menu.py
      - uses: actions/upload-artifact@v4
        with:
          name: buy-menu-${{ matrix.slug }}
          path: out
