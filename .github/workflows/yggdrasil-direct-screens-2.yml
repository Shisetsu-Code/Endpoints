name: yggdrasil-direct-screens-2

on:
  push:
    paths:
      - '.github/workflows/yggdrasil-direct-screens-2.yml'
  workflow_dispatch:

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: gemstone-jam
            gameid: "10852"
          - slug: 3-piggies-of-bank
            gameid: "10945"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Reach game
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
        run: |
          cat >/tmp/screen.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          u=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          async def main():
            async with async_playwright() as p:
                b=await p.chromium.launch(headless=True)
                c=await b.new_context(viewport={"width":1296,"height":729})
                pg=await c.new_page()
                pg.on("request",lambda r: ev.append({"method":r.method,"url":r.url,"post":r.post_data,"type":r.resource_type}) if r.resource_type in ("xhr","fetch","document") else None)
                await pg.goto(u,wait_until="domcontentloaded",timeout=90000)
                await pg.wait_for_timeout(18000)
                body=pg.locator("body"); box=await body.bounding_box()
                # aggressive intro handling without betting: center/splash/audio zones only
                for _ in range(5):
                    for rx,ry in [(0.50,0.85),(0.50,0.90),(0.59,0.62),(0.50,0.78),(0.50,0.68)]:
                        try: await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                        except: pass
                        await pg.wait_for_timeout(400)
                    await pg.wait_for_timeout(900)
                await pg.wait_for_timeout(3500)
                await body.screenshot(path=str(out/"game.png"))
                (out/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"game_id":gid,"runtime":u,"service":[x for x in ev if "game.web/service" in x["url"]]},indent=2),encoding="utf-8")
                await b.close()
          asyncio.run(main())
          PY
          python /tmp/screen.py
      - uses: actions/upload-artifact@v4
        with:
          name: direct-${{ matrix.slug }}
          path: out
