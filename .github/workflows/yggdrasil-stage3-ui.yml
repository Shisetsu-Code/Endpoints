name: yggdrasil-stage3-ui

on:
  push:
    paths:
      - '.github/workflows/yggdrasil-stage3-ui.yml'
  workflow_dispatch:

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: multifly-2-multimax, gameid: "10894", mode: buy, start_x: 720, start_y: 830, buy_x: 1370, buy_y: 800}
          - {slug: 3-piggies-of-bank, gameid: "10945", mode: buy, start_x: 725, start_y: 790, buy_x: 1370, buy_y: 800}
          - {slug: timber-trail-treasures, gameid: "10911", mode: buy, start_x: 715, start_y: 925, buy_x: 1345, buy_y: 695}
          - {slug: giga-zombies-gigablox, gameid: "10909", mode: buy, start_x: 720, start_y: 825, buy_x: 1370, buy_y: 800}
          - {slug: turbo-gold-deluxe-gigablox, gameid: "10981", mode: buy, start_x: 0, start_y: 0, buy_x: 95, buy_y: 455}
          - {slug: gemstone-jam, gameid: "10852", mode: spin, start_x: 720, start_y: 820, buy_x: 0, buy_y: 0}
          - {slug: red-dragon-sails, gameid: "10764", mode: audio, start_x: 720, start_y: 840, buy_x: 0, buy_y: 0}
          - {slug: bloody-pesos, gameid: "10809", mode: audio, start_x: 720, start_y: 870, buy_x: 0, buy_y: 0}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Traverse UI
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
          MODE: ${{ matrix.mode }}
          START_X: ${{ matrix.start_x }}
          START_Y: ${{ matrix.start_y }}
          BUY_X: ${{ matrix.buy_x }}
          BUY_Y: ${{ matrix.buy_y }}
        run: |
          cat > /tmp/ui.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          async def click(pg,x,y,n=1,pause=700):
            for _ in range(n):
              await pg.mouse.click(x,y)
              await pg.wait_for_timeout(pause)
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              def rq(r):
                if r.resource_type in ("xhr","fetch","document"):
                  try: post=r.post_data
                  except: post=None
                  ev.append({"method":r.method,"url":r.url,"type":r.resource_type,"post":post})
              pg.on("request",rq)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              await pg.screenshot(path=str(out/"loaded.png"))
              mode=os.environ["MODE"]
              sx=float(os.environ["START_X"]); sy=float(os.environ["START_Y"])
              if mode=="audio":
                # choose muted; modal icons are around x850/y590, then continue lower center.
                await click(pg,850,592,2,900)
                await click(pg,sx,sy,3,1200)
              elif sx and sy:
                # click a tight cross around visible CTA to survive small rendering shifts.
                for dx,dy in [(0,0),(-25,0),(25,0),(0,-15),(0,15)]:
                  await click(pg,sx+dx,sy+dy,1,650)
                await pg.wait_for_timeout(2500)
              await pg.screenshot(path=str(out/"main.png"))
              before=len(ev)
              if mode=="buy":
                bx=float(os.environ["BUY_X"]); by=float(os.environ["BUY_Y"])
                for dx,dy in [(0,0),(-20,0),(20,0),(0,-15),(0,15)]:
                  await click(pg,bx+dx,by+dy,1,400)
                await pg.wait_for_timeout(1600)
                await pg.screenshot(path=str(out/"after-action.png"))
              elif mode=="spin":
                # main spin button is on right side, ~1300/500 for this modern shell.
                await click(pg,1300,505,1,1500)
                await pg.screenshot(path=str(out/"after-action.png"))
              else:
                await pg.wait_for_timeout(1200)
                await pg.screenshot(path=str(out/"after-action.png"))
              delta=ev[before:]
              (out/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"game_id":gid,"mode":mode,"delta":delta},indent=2),encoding="utf-8")
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-${{ matrix.slug }}
          path: out
