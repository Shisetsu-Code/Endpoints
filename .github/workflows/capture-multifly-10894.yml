name: capture-multifly-10894

on:
  push:
    paths:
      - '.github/workflows/capture-multifly-10894.yml'
  workflow_dispatch:

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: fs5, x: 572, y: 370, expected: 40}
          - {label: fs5-upgraded, x: 1146, y: 370, expected: 60}
          - {label: fs10, x: 572, y: 575, expected: 70}
          - {label: fs10-upgraded, x: 1146, y: 575, expected: 100}
          - {label: fs15, x: 572, y: 778, expected: 125}
          - {label: fs15-upgraded, x: 1146, y: 778, expected: 180}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture purchase
        env:
          LABEL: ${{ matrix.label }}
          X: ${{ matrix.x }}
          Y: ${{ matrix.y }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          cat > /tmp/cap.py <<'PY'
          import asyncio,json,os,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out"); out.mkdir(exist_ok=True)
          gid="10894"
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          reqs=[]; resps=[]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              def onreq(r):
                if "demo.yggdrasilgaming.com/game.web/service?fn=play" in r.url:
                  reqs.append({"method":r.method,"url":r.url,"post":r.post_data})
              async def onresp(r):
                if "demo.yggdrasilgaming.com/game.web/service?fn=play" in r.url:
                  try: body=await r.json()
                  except:
                    try: body=await r.text()
                    except Exception as e: body={"error":str(e)}
                  resps.append({"status":r.status,"content_type":r.headers.get("content-type"),"body":body})
              pg.on("request",onreq); pg.on("response",onresp)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              # start intro
              for dx,dy in [(0,0),(-20,0),(20,0),(0,-12),(0,12)]:
                await pg.mouse.click(720+dx,830+dy); await pg.wait_for_timeout(500)
              await pg.wait_for_timeout(4500)
              # open buy
              await pg.mouse.click(1370,800); await pg.wait_for_timeout(1200)
              await pg.screenshot(path=str(out/"menu.png"))
              # select purchase
              await pg.mouse.click(float(os.environ["X"]),float(os.environ["Y"]))
              await pg.wait_for_timeout(1800)
              await pg.screenshot(path=str(out/"selected.png"))
              # if selection opened a confirm modal, press likely confirm regions.
              if not reqs:
                for x,y in [(842,582),(850,585),(830,582),(842,600)]:
                  await pg.mouse.click(x,y); await pg.wait_for_timeout(700)
                  if reqs: break
              await pg.wait_for_timeout(5000)
              await pg.screenshot(path=str(out/"final.png"))
              body=resps[0]["body"] if resps else None
              txt=json.dumps(body,ensure_ascii=False).lower() if body is not None else ""
              terms=[t for t in ["choice","select","selection","choose","pick","option"] if t in txt]
              finish=("finishspins" in txt or '"status":"completed"' in txt or '"status": "completed"' in txt)
              result={"provider":"yggdrasil","game_id":gid,"label":os.environ["LABEL"],"expected_cost":os.environ["EXPECTED"],"requests":reqs,"responses":resps,"choice_terms":terms,"finish_signal":finish}
              (out/"capture.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"label":result["label"],"requests":reqs,"response_statuses":[x["status"] for x in resps],"choice_terms":terms,"finish_signal":finish},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/cap.py
      - uses: actions/upload-artifact@v4
        with:
          name: multifly-10894-${{ matrix.label }}
          path: out
