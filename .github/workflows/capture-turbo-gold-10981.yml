name: capture-turbo-gold-10981
on:
  push:
    paths: ['.github/workflows/capture-turbo-gold-10981.yml']
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture buy session
        run: |
          cat >/tmp/c.py <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True);gid="10981"
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          reqs=[];resps=[]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1440,"height":1000});pg=await c.new_page()
              def rq(r):
                if "game.web/service?fn=play" in r.url:reqs.append({"method":r.method,"url":r.url,"post":r.post_data})
              async def rp(r):
                if "game.web/service?fn=play" in r.url:
                  try: body=await r.json()
                  except: body=await r.text()
                  resps.append({"status":r.status,"content_type":r.headers.get("content-type"),"body":body})
              pg.on("request",rq);pg.on("response",rp)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(20000)
              await pg.mouse.click(95,455);await pg.wait_for_timeout(1200);await pg.screenshot(path=str(out/"menu.png"))
              await pg.mouse.click(720,615);await pg.wait_for_timeout(1500);await pg.screenshot(path=str(out/"selected.png"))
              if not reqs:
                for x,y in [(842,582),(720,615),(842,650)]:
                  await pg.mouse.click(x,y);await pg.wait_for_timeout(900)
                  if reqs: break
              await pg.wait_for_timeout(5000)
              body=resps[0]["body"] if resps else None;txt=json.dumps(body,ensure_ascii=False).lower() if body is not None else ""
              data={"provider":"yggdrasil","game_id":gid,"action":"buy_bonus_session","observed_ui":{"base_bet_eur":2,"buy_price_eur":120,"advertised_free_spins":"5-30"},"requests":reqs,"responses":resps,"choice_terms":[t for t in ["choice","select","selection","choose","pick","option"] if t in txt],"finish_signal":"finishspins" in txt}
              (out/"capture.json").write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"requests":reqs,"statuses":[x["status"] for x in resps],"choices":data["choice_terms"],"finish":data["finish_signal"]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/c.py
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-gold-10981-buy
          path: out
