name: direct-yggdrasil-batch-8

on:
  push:
    paths:
      - '.github/workflows/direct-yggdrasil-batch-8.yml'
  workflow_dispatch:

jobs:
  direct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: multifly-2-multimax, gameid: "10894"}
          - {slug: 3-piggies-of-bank, gameid: "10945"}
          - {slug: timber-trail-treasures, gameid: "10911"}
          - {slug: giga-zombies-gigablox, gameid: "10909"}
          - {slug: gemstone-jam, gameid: "10852"}
          - {slug: turbo-gold-deluxe-gigablox, gameid: "10981"}
          - {slug: red-dragon-sails, gameid: "10764"}
          - {slug: bloody-pesos, gameid: "10809"}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Direct runtime screenshot
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
        run: |
          cat > /tmp/direct.py <<'PY'
          import asyncio, json, os
          from pathlib import Path
          from playwright.async_api import async_playwright

          out=Path("out"); out.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              def onreq(r):
                if r.resource_type in ("xhr","fetch","document"):
                  try: post=r.post_data
                  except: post=None
                  ev.append({"method":r.method,"url":r.url,"type":r.resource_type,"post":post})
              pg.on("request",onreq)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(20000)
              body=pg.locator("body")
              box=await body.bounding_box()
              await body.screenshot(path=str(out/"stage0.png"))
              # Common intro controls: center lower, audio dialog, continue.
              for round_no in range(7):
                for x,y in [(720,450),(648,624),(648,550),(648,680),(765,450),(530,450)]:
                  try: await body.click(position={"x":x,"y":y},force=True)
                  except: pass
                  await pg.wait_for_timeout(350)
                await pg.wait_for_timeout(900)
              await pg.wait_for_timeout(3500)
              await body.screenshot(path=str(out/"ready.png"))
              service=[e for e in ev if "demo.yggdrasilgaming.com/game.web/service" in e["url"]]
              (out/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"game_id":gid,"runtime_url":url,"body_box":box,"service":service},indent=2),encoding="utf-8")
              print(json.dumps({"slug":os.environ["SLUG"],"game_id":gid,"body_box":box,"service_count":len(service)},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/direct.py
      - uses: actions/upload-artifact@v4
        with:
          name: direct8-${{ matrix.slug }}
          path: out
