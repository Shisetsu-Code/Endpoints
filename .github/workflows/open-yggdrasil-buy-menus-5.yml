name: open-yggdrasil-buy-menus-5

on:
  push:
    paths:
      - '.github/workflows/open-yggdrasil-buy-menus-5.yml'
  workflow_dispatch:

jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: multifly-2-multimax
            url: https://yggdrasilgaming.com/games/multifly-2-multimax#tryit
            gameid: "10894"
            buy_x: 1240
            buy_y: 585
            prep: normal
          - slug: turbo-gold-deluxe-gigablox
            url: https://yggdrasilgaming.com/games/turbo-gold-deluxe-gigablox#tryit
            gameid: "10981"
            buy_x: 145
            buy_y: 335
            prep: normal
          - slug: giga-zombies-gigablox
            url: https://yggdrasilgaming.com/games/giga-zombies-gigablox#tryit
            gameid: "10909"
            buy_x: 1240
            buy_y: 585
            prep: normal
          - slug: timber-trail-treasures
            url: https://yggdrasilgaming.com/games/timber-trail-treasures#tryit
            gameid: "10911"
            buy_x: 1210
            buy_y: 540
            prep: normal
          - slug: red-dragon-sails
            url: https://yggdrasilgaming.com/games/red-dragon-sails#tryit
            gameid: "10764"
            buy_x: 1210
            buy_y: 575
            prep: red-dragon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Open BUY menu
        env:
          TARGET_URL: ${{ matrix.url }}
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
          BUY_X: ${{ matrix.buy_x }}
          BUY_Y: ${{ matrix.buy_y }}
          PREP: ${{ matrix.prep }}
        run: |
          cat > /tmp/menu.py <<'PY'
          import asyncio, json, os
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path("out"); OUT.mkdir(exist_ok=True)
          events=[]

          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  c=await b.new_context(viewport={"width":1440,"height":1000})
                  pg=await c.new_page()

                  def req(r):
                      if r.resource_type in ("xhr","fetch","document"):
                          try: post=r.post_data
                          except: post=None
                          events.append({"method":r.method,"url":r.url,"type":r.resource_type,"post":post})
                  pg.on("request",req)

                  await pg.goto(os.environ["TARGET_URL"],wait_until="domcontentloaded",timeout=90000)
                  await pg.wait_for_timeout(1800)
                  for t in ["ACCEPT COOKIES","YES, I AM OVER 18"]:
                      try:
                          q=pg.get_by_text(t,exact=False)
                          if await q.count(): await q.first.click(timeout=2500)
                      except: pass
                  try:
                      q=pg.get_by_text("PLAY",exact=True)
                      if await q.count(): await q.first.click(timeout=3500)
                  except: pass

                  await pg.wait_for_timeout(16000)
                  gf=next(f for f in pg.frames if f"staticdemo.yggdrasilgaming.com/{os.environ['GAMEID']}/" in f.url)
                  body=gf.locator("body")
                  box=await body.bounding_box()

                  if os.environ["PREP"]=="red-dragon":
                      # audio prompt: mute, then continue
                      for x,y in [(765,450),(650,655),(650,655)]:
                          try: await body.click(position={"x":x,"y":y},force=True)
                          except: pass
                          await pg.wait_for_timeout(1500)
                  else:
                      # close splash/start overlays in common YGG placements.
                      for _ in range(6):
                          for x,y in [(648,624),(648,550),(648,680)]:
                              try: await body.click(position={"x":x,"y":y},force=True)
                              except: pass
                              await pg.wait_for_timeout(400)
                          await pg.wait_for_timeout(900)

                  await pg.wait_for_timeout(2500)
                  await body.screenshot(path=str(OUT/"before-buy.png"))

                  before=len(events)
                  await body.click(position={"x":float(os.environ["BUY_X"]),"y":float(os.environ["BUY_Y"])},force=True)
                  await pg.wait_for_timeout(1800)
                  await body.screenshot(path=str(OUT/"buy-menu.png"))

                  delta=events[before:]
                  meta={
                      "slug":os.environ["SLUG"],
                      "game_id":os.environ["GAMEID"],
                      "runtime_url":gf.url,
                      "body_box":box,
                      "buy_click":{"x":float(os.environ["BUY_X"]),"y":float(os.environ["BUY_Y"])},
                      "network_delta":delta
                  }
                  (OUT/"meta.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
                  print(json.dumps(meta,indent=2))
                  await b.close()
          asyncio.run(main())
          PY
          python /tmp/menu.py

      - uses: actions/upload-artifact@v4
        with:
          name: buy-menu-${{ matrix.slug }}
          path: out
