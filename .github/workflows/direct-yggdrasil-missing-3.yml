name: direct-yggdrasil-missing-3

on:
  push:
    paths:
      - '.github/workflows/direct-yggdrasil-missing-3.yml'
  workflow_dispatch:

jobs:
  direct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: 3-piggies-of-bank
            gameid: "10945"
          - slug: gemstone-jam
            gameid: "10852"
          - slug: bloody-pesos
            gameid: "10809"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Direct launch
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
        run: |
          cat > /tmp/direct.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright

          out=Path("out"); out.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              pg.on("request",lambda r: ev.append({"method":r.method,"url":r.url,"type":r.resource_type,"post":r.post_data}) if r.resource_type in ("xhr","fetch","document") else None)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              body=pg.locator("body")
              box=await body.bounding_box()
              for _ in range(8):
                for x,y in [(648,624),(648,550),(648,680),(720,450)]:
                  try: await body.click(position={"x":x,"y":y},force=True)
                  except: pass
                  await pg.wait_for_timeout(350)
                await pg.wait_for_timeout(1000)
              await pg.wait_for_timeout(3500)
              await body.screenshot(path=str(out/"game.png"))
              service=[e for e in ev if "demo.yggdrasilgaming.com/game.web/service" in e["url"]]
              meta={"slug":os.environ["SLUG"],"game_id":gid,"runtime_url":url,"body_box":box,"service":service}
              (out/"meta.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
              print(json.dumps(meta,indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/direct.py
      - uses: actions/upload-artifact@v4
        with:
          name: direct-${{ matrix.slug }}
          path: out
