name: capture-piggies-10945
on:
  push:
    paths: ['.github/workflows/capture-piggies-10945.yml']
  workflow_dispatch:
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: double, x: 572, y: 374, expected: 180}
          - {label: collect, x: 1146, y: 374, expected: 120}
          - {label: mystery, x: 572, y: 578, expected: 150}
          - {label: random-bank, x: 1146, y: 578, expected: 150}
          - {label: all-banks, x: 572, y: 780, expected: 250}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture purchase
        env:
          LABEL: ${{ matrix.label }}
          X: ${{ matrix.x }}
          Y: ${{ matrix.y }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          cat > /tmp/cap.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True); gid="10945"
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          reqs=[];resps=[]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1440,"height":1000});pg=await c.new_page()
              def rq(r):
                if "game.web/service?fn=play" in r.url:reqs.append({"method":r.method,"url":r.url,"post":r.post_data})
              async def rp(r):
                if "game.web/service?fn=play" in r.url:
                  try: body=await r.json()
                  except: body=await r.text()
                  resps.append({"status":r.status,"content_type":r.headers.get("content-type"),"body":body})
              pg.on("request",rq);pg.on("response",rp)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(18000)
              for dx,dy in [(0,0),(-20,0),(20,0),(0,-15),(0,15)]:
                await pg.mouse.click(725+dx,790+dy);await pg.wait_for_timeout(500)
              await pg.wait_for_timeout(4500);await pg.mouse.click(1370,800);await pg.wait_for_timeout(1200)
              await pg.mouse.click(float(os.environ["X"]),float(os.environ["Y"]));await pg.wait_for_timeout(1200)
              await pg.screenshot(path=str(out/"selected.png"))
              if not reqs:
                await pg.mouse.click(842,582);await pg.wait_for_timeout(1800)
              await pg.wait_for_timeout(5000)
              body=resps[0]["body"] if resps else None
              txt=json.dumps(body,ensure_ascii=False).lower() if body is not None else ""
              data={"provider":"yggdrasil","game_id":gid,"label":os.environ["LABEL"],"expected_cost":os.environ["EXPECTED"],"requests":reqs,"responses":resps,"choice_terms":[t for t in ["choice","select","selection","choose","pick","option"] if t in txt],"finish_signal":("finishspins" in txt)}
              (out/"capture.json").write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"label":data["label"],"requests":reqs,"statuses":[x["status"] for x in resps],"choices":data["choice_terms"],"finish":data["finish_signal"]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/cap.py
      - uses: actions/upload-artifact@v4
        with:
          name: piggies-10945-${{ matrix.label }}
          path: out
