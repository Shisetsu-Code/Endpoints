name: capture-gemstone-10852-base

on:
  push:
    paths:
      - '.github/workflows/capture-gemstone-10852-base.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture base spin
        run: |
          cat > /tmp/cap.py <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True)
          gid="10852"
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          reqs=[];resps=[]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              def rq(r):
                if "game.web/service?fn=play" in r.url:reqs.append({"method":r.method,"url":r.url,"post":r.post_data})
              async def rp(r):
                if "game.web/service?fn=play" in r.url:
                  try: body=await r.json()
                  except:
                    try: body=await r.text()
                    except Exception as e: body={"error":str(e)}
                  resps.append({"status":r.status,"content_type":r.headers.get("content-type"),"body":body})
              pg.on("request",rq);pg.on("response",rp)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              for dx,dy in [(0,0),(-20,0),(20,0)]:
                await pg.mouse.click(720+dx,820+dy); await pg.wait_for_timeout(700)
              await pg.wait_for_timeout(3500)
              await pg.mouse.click(1300,505)
              await pg.wait_for_timeout(3500)
              data={"provider":"yggdrasil","game_id":gid,"action":"base_spin","buy_bonus_observed":false,"requests":reqs,"responses":resps}
              (out/"capture.json").write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"requests":reqs,"statuses":[r["status"] for r in resps]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/cap.py
      - uses: actions/upload-artifact@v4
        with:
          name: gemstone-10852-base
          path: out
