name: yggdrasil-stage2-six

on:
  push:
    paths:
      - '.github/workflows/yggdrasil-stage2-six.yml'
  workflow_dispatch:

jobs:
  stage2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: multifly-2-multimax, gameid: "10894", action: buy, start_x: 720, start_y: 830, buy_x: 1240, buy_y: 585}
          - {slug: timber-trail-treasures, gameid: "10911", action: buy, start_x: 715, start_y: 925, buy_x: 1210, buy_y: 540}
          - {slug: giga-zombies-gigablox, gameid: "10909", action: buy, start_x: 720, start_y: 825, buy_x: 1240, buy_y: 585}
          - {slug: turbo-gold-deluxe-gigablox, gameid: "10981", action: buy, start_x: 0, start_y: 0, buy_x: 100, buy_y: 455}
          - {slug: 3-piggies-of-bank, gameid: "10945", action: main, start_x: 725, start_y: 790, buy_x: 0, buy_y: 0}
          - {slug: gemstone-jam, gameid: "10852", action: main, start_x: 720, start_y: 820, buy_x: 0, buy_y: 0}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Stage 2
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
          ACTION: ${{ matrix.action }}
          START_X: ${{ matrix.start_x }}
          START_Y: ${{ matrix.start_y }}
          BUY_X: ${{ matrix.buy_x }}
          BUY_Y: ${{ matrix.buy_y }}
        run: |
          cat > /tmp/s2.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              def rq(r):
                if r.resource_type in ("xhr","fetch","document"):
                  try: post=r.post_data
                  except: post=None
                  ev.append({"method":r.method,"url":r.url,"type":r.resource_type,"post":post})
              pg.on("request",rq)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              body=pg.locator("body")
              sx=float(os.environ["START_X"]); sy=float(os.environ["START_Y"])
              if sx and sy:
                for _ in range(3):
                  try: await body.click(position={"x":sx,"y":sy},force=True)
                  except: pass
                  await pg.wait_for_timeout(1200)
              await pg.wait_for_timeout(3500)
              await body.screenshot(path=str(out/"main.png"))
              before=len(ev)
              if os.environ["ACTION"]=="buy":
                bx=float(os.environ["BUY_X"]); by=float(os.environ["BUY_Y"])
                await body.click(position={"x":bx,"y":by},force=True)
                await pg.wait_for_timeout(1800)
                await body.screenshot(path=str(out/"buy-menu.png"))
              delta=ev[before:]
              (out/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"game_id":gid,"action":os.environ["ACTION"],"delta":delta},indent=2),encoding="utf-8")
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/s2.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-${{ matrix.slug }}
          path: out
