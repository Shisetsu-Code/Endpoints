name: direct-open-buy-menus-5

on:
  push:
    paths:
      - '.github/workflows/direct-open-buy-menus-5.yml'
  workflow_dispatch:

jobs:
  menu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: multifly-2-multimax, gameid: "10894", buy_x: 1240, buy_y: 585, prep: modern}
          - {slug: timber-trail-treasures, gameid: "10911", buy_x: 1210, buy_y: 540, prep: modern}
          - {slug: giga-zombies-gigablox, gameid: "10909", buy_x: 1240, buy_y: 585, prep: modern}
          - {slug: turbo-gold-deluxe-gigablox, gameid: "10981", buy_x: 145, buy_y: 335, prep: turbo}
          - {slug: red-dragon-sails, gameid: "10764", buy_x: 1210, buy_y: 575, prep: red}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Direct open BUY
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
          BUY_X: ${{ matrix.buy_x }}
          BUY_Y: ${{ matrix.buy_y }}
          PREP: ${{ matrix.prep }}
        run: |
          cat > /tmp/menu.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True)
          gid=os.environ["GAMEID"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={"width":1440,"height":1000})
              pg=await c.new_page()
              def rq(r):
                if r.resource_type in ("xhr","fetch","document"):
                  try: post=r.post_data
                  except: post=None
                  ev.append({"method":r.method,"url":r.url,"type":r.resource_type,"post":post})
              pg.on("request",rq)
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
              await pg.wait_for_timeout(18000)
              body=pg.locator("body")
              await body.screenshot(path=str(out/"loaded.png"))
              prep=os.environ["PREP"]
              if prep=="red":
                seq=[(765,450),(650,655),(650,655),(648,624),(648,550)]
              elif prep=="turbo":
                seq=[(648,624),(648,680),(648,550)]
              else:
                seq=[(648,624),(648,550),(648,680),(720,820),(725,790)]
              for _ in range(5):
                for x,y in seq:
                  try: await body.click(position={"x":x,"y":y},force=True)
                  except: pass
                  await pg.wait_for_timeout(300)
                await pg.wait_for_timeout(900)
              await pg.wait_for_timeout(2500)
              await body.screenshot(path=str(out/"ready.png"))
              before=len(ev)
              try:
                await body.click(position={"x":float(os.environ["BUY_X"]),"y":float(os.environ["BUY_Y"])},force=True)
              except Exception as e:
                (out/"error.txt").write_text(str(e))
              await pg.wait_for_timeout(1800)
              await body.screenshot(path=str(out/"buy-menu.png"))
              delta=ev[before:]
              (out/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"game_id":gid,"runtime_url":url,"buy":{"x":os.environ["BUY_X"],"y":os.environ["BUY_Y"]},"delta":delta},indent=2),encoding="utf-8")
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/menu.py
      - uses: actions/upload-artifact@v4
        with:
          name: direct-buy-${{ matrix.slug }}
          path: out
