name: open-delayed-yggdrasil-menus
on:
  push:
    paths: ['.github/workflows/open-delayed-yggdrasil-menus.yml']
  workflow_dispatch:
jobs:
  menu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slug: timber-trail-treasures, gameid: "10911", kind: normal, sx: 715, sy: 920, bx: 1345, by: 695}
          - {slug: giga-zombies-gigablox, gameid: "10909", kind: normal, sx: 720, sy: 825, bx: 1370, by: 800}
          - {slug: red-dragon-sails, gameid: "10764", kind: audio, sx: 720, sy: 840, bx: 1345, by: 790}
          - {slug: bloody-pesos, gameid: "10809", kind: audio, sx: 720, sy: 870, bx: 1345, by: 790}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Reach menu with delayed transitions
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
          KIND: ${{ matrix.kind }}
          SX: ${{ matrix.sx }}
          SY: ${{ matrix.sy }}
          BX: ${{ matrix.bx }}
          BY: ${{ matrix.by }}
        run: |
          cat >/tmp/m.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          out=Path("out");out.mkdir(exist_ok=True);gid=os.environ["GAMEID"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1440,"height":1000});pg=await c.new_page()
              await pg.goto(url,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(20000)
              if os.environ["KIND"]=="audio":
                await pg.mouse.click(850,592);await pg.wait_for_timeout(1800)
              sx=float(os.environ["SX"]);sy=float(os.environ["SY"])
              for _ in range(3):
                await pg.mouse.click(sx,sy);await pg.wait_for_timeout(2500)
              await pg.wait_for_timeout(10000)
              await pg.screenshot(path=str(out/"main.png"))
              bx=float(os.environ["BX"]);by=float(os.environ["BY"])
              await pg.mouse.click(bx,by);await pg.wait_for_timeout(1800)
              await pg.screenshot(path=str(out/"buy-menu.png"))
              (out/"meta.json").write_text(json.dumps({"slug":os.environ["SLUG"],"game_id":gid},indent=2),encoding="utf-8")
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/m.py
      - uses: actions/upload-artifact@v4
        with:
          name: delayed-menu-${{ matrix.slug }}
          path: out
