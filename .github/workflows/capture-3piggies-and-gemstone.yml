name: capture-3piggies-and-gemstone

on:
  push:
    paths: ['.github/workflows/capture-3piggies-and-gemstone.yml']
  workflow_dispatch:

jobs:
  piggies-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Open 3 Piggies buy menu
        run: |
          cat >/tmp/p.py <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          O=Path("out");O.mkdir(exist_ok=True);gid="10945"
          u=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1296,"height":729});pg=await c.new_page()
              await pg.goto(u,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(16000)
              body=pg.locator("body");box=await body.bounding_box()
              for _ in range(4):
                for rx,ry in [(0.5,0.85),(0.5,0.9),(0.5,0.78),(0.5,0.85)]:
                  try:await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                  except:pass
                  await pg.wait_for_timeout(350)
                await pg.wait_for_timeout(700)
              await pg.wait_for_timeout(2500)
              await body.click(position={"x":1240,"y":585},force=True);await pg.wait_for_timeout(1300)
              await body.screenshot(path=str(O/"buy-menu.png"))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/p.py
      - uses: actions/upload-artifact@v4
        with: {name: piggies-buy-menu, path: out}

  gemstone-spin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture Gemstone base spin
        run: |
          cat >/tmp/g.py <<'PY'
          import asyncio,json,time
          from pathlib import Path
          from urllib.parse import parse_qs
          from playwright.async_api import async_playwright
          O=Path("out");O.mkdir(exist_ok=True);gid="10852"
          u=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          ev=[]
          def form(s):
            if not s:return {}
            d=parse_qs(s,keep_blank_values=True);return {k:(v[0] if len(v)==1 else v) for k,v in d.items()}
          async def rb(r):
            try:t=await r.text()
            except Exception as e:return {"_error":str(e)}
            try:return json.loads(t)
            except:return t[:200000]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True);c=await b.new_context(viewport={"width":1296,"height":729});pg=await c.new_page()
              def rq(r):
                if "game.web/service" in r.url:ev.append({"kind":"request","method":r.method,"url":r.url,"post_data":r.post_data,"form":form(r.post_data),"ts":time.time()})
              async def rs(r):
                if "game.web/service" in r.url:ev.append({"kind":"response","method":r.request.method,"url":r.url,"status":r.status,"body":await rb(r),"ts":time.time()})
              pg.on("request",rq);pg.on("response",rs)
              await pg.goto(u,wait_until="domcontentloaded",timeout=90000);await pg.wait_for_timeout(16000)
              body=pg.locator("body");box=await body.bounding_box()
              for _ in range(4):
                for rx,ry in [(0.5,0.85),(0.5,0.9),(0.5,0.78),(0.5,0.85)]:
                  try:await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                  except:pass
                  await pg.wait_for_timeout(300)
                await pg.wait_for_timeout(650)
              await pg.wait_for_timeout(2500)
              start=len(ev)
              await body.click(position={"x":1190,"y":365},force=True)
              await pg.wait_for_timeout(4000)
              reqs=[x for x in ev[start:] if x["kind"]=="request" and "fn=play" in x["url"]]
              resps=[x for x in ev[start:] if x["kind"]=="response" and "fn=play" in x["url"]]
              pairs=[{"request":r,"response":resps[i] if i<len(resps) else None} for i,r in enumerate(reqs)]
              result={"provider":"yggdrasil","slug":"gemstone-jam","game_id":gid,"action":"base-spin","endpoint":"https://demo.yggdrasilgaming.com/game.web/service?fn=play","pairs":pairs}
              (O/"capture.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf-8")
              print(json.dumps({"play_count":len(pairs),"forms":[p["request"]["form"] for p in pairs],"statuses":[(p.get("response") or {}).get("status") for p in pairs]},indent=2))
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/g.py
      - uses: actions/upload-artifact@v4
        with: {name: gemstone-base-spin, path: out}
