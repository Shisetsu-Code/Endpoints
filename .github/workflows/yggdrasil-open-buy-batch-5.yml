name: yggdrasil-open-buy-batch-5

on:
  push:
    paths:
      - '.github/workflows/yggdrasil-open-buy-batch-5.yml'
  workflow_dispatch:

jobs:
  open-buy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: multifly-2-multimax
            gameid: "10894"
            buy_x: 1240
            buy_y: 585
            audio: "no"
          - slug: turbo-gold-deluxe-gigablox
            gameid: "10981"
            buy_x: 145
            buy_y: 330
            audio: "no"
          - slug: timber-trail-treasures
            gameid: "10911"
            buy_x: 1220
            buy_y: 540
            audio: "no"
          - slug: giga-zombies-gigablox
            gameid: "10909"
            buy_x: 1240
            buy_y: 585
            audio: "no"
          - slug: red-dragon-sails
            gameid: "10764"
            buy_x: 1220
            buy_y: 585
            audio: "yes"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Open buy menu
        env:
          SLUG: ${{ matrix.slug }}
          GAMEID: ${{ matrix.gameid }}
          BUY_X: ${{ matrix.buy_x }}
          BUY_Y: ${{ matrix.buy_y }}
          AUDIO: ${{ matrix.audio }}
        run: |
          cat > /tmp/openbuy.py <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright

          gid=os.environ["GAMEID"]
          slug=os.environ["SLUG"]
          url=f"https://staticdemo.yggdrasilgaming.com/{gid}/index.html?appsrv=https://demo.yggdrasilgaming.com&boostUrl=/boost/current/boost.js&channel=pc&countryCode=us&currency=EUR&fullscreen=yes&gameid={gid}&key=&lang=en&license=mt&org=Demo&pcUrl=/partnerconnect/current/partnerconnect.js"
          out=Path("out"); out.mkdir(exist_ok=True)
          events=[]

          async def main():
            async with async_playwright() as p:
                b=await p.chromium.launch(headless=True)
                c=await b.new_context(viewport={"width":1296,"height":729})
                pg=await c.new_page()
                pg.on("request",lambda r: events.append({"method":r.method,"url":r.url,"post":r.post_data,"type":r.resource_type}) if r.resource_type in ("xhr","fetch","document") else None)
                await pg.goto(url,wait_until="domcontentloaded",timeout=90000)
                await pg.wait_for_timeout(15000)
                body=pg.locator("body")
                box=await body.bounding_box()
                # Handle intro/audio/splash with deterministic clicks.
                seq=[]
                if os.environ["AUDIO"]=="yes":
                    seq += [(0.59,0.62),(0.50,0.90)]
                seq += [(0.50,0.85),(0.50,0.90),(0.50,0.78),(0.50,0.85)]
                for _ in range(4):
                    for rx,ry in seq:
                        try: await body.click(position={"x":box["width"]*rx,"y":box["height"]*ry},force=True)
                        except: pass
                        await pg.wait_for_timeout(500)
                    await pg.wait_for_timeout(1000)
                await pg.wait_for_timeout(3500)
                await body.screenshot(path=str(out/"before-buy.png"))
                before=len(events)
                await body.click(position={"x":float(os.environ["BUY_X"]),"y":float(os.environ["BUY_Y"])},force=True)
                await pg.wait_for_timeout(1800)
                await body.screenshot(path=str(out/"buy-menu.png"))
                delta=events[before:]
                meta={"slug":slug,"game_id":gid,"runtime_url":url,"buy_click":{"x":os.environ["BUY_X"],"y":os.environ["BUY_Y"]},"delta":delta}
                (out/"meta.json").write_text(json.dumps(meta,indent=2),encoding="utf-8")
                print(json.dumps(meta,indent=2))
                await b.close()
          asyncio.run(main())
          PY
          python /tmp/openbuy.py

      - uses: actions/upload-artifact@v4
        with:
          name: buy-menu-${{ matrix.slug }}
          path: out
